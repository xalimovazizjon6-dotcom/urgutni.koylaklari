<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>👕 "Ugutni ko'ylaklari" - Tizimga Kirish</title>
    <style>
        /* Sahifa umumiy orqa foni */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #050b14;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Asosiy ikki qismli karta qutisi (Rasm dizayni asosida) */
        .login-container {
            width: 800px;
            height: 450px;
            background: #0b132b;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.4);
            border: 2px solid rgba(0, 198, 255, 0.6);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Chap tomon: Forma qismi */
        .login-form-side {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .login-form-side h2 {
            color: #ffffff;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* Input maydonlari */
        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 198, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-box input:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 12px rgba(0, 198, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Input ikonchalari */
        .input-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: #00c6ff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Kirish tugmasi */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.8);
            transform: translateY(-2px);
        }

        /* Yordamchi havolalar */
        .form-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #8be9fd;
        }

        .form-footer a {
            color: #00c6ff;
            text-decoration: none;
            font-weight: bold;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        /* O'ng tomon: Ko'k va gradient fonli qism (Rasmda qizil bo'lgan joy) */
        .login-banner-side {
            flex: 1;
            background: linear-gradient(135deg, #0072ff 0%, #03045e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            color: white;
            border-top-left-radius: 120px;
            border-bottom-left-radius: 40px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .login-banner-side h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .login-banner-side p {
            font-size: 14px;
            color: #e2e8f0;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Chap tomon: Login Formasi -->
        <div class="login-form-side">
            <h2 style="text-align: center;">Login</h2>
            
            <!-- action="index.html" orqali kirganda dashboardga o'tadi -->
            <form action="dashboard.html" method="GET">
                
                <!-- Foydalanuvchi nomi -->
                <div class="input-box">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <!-- Parol -->
                <div class="input-box">
                    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <button type="submit" class="submit-btn">Login</button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="#">Sign Up</a><br>
                <a href="#" style="color: #a0aec0; font-size: 12px; margin-top: 5px; display: inline-block;">Forgot Password?</a>
            </div>
        </div>

        <!-- O'ng tomon: Ko'k gradient banner qismi -->
        <div class="login-banner-side">
            <h1 style="color: #050b14; font-style: italic;">XUSH KELIBSIZ!</h1>
            <p style="color: #0b132b; font-weight: bold;">Urgutni ko'ylaklari boshqaruv tizimi</p>
        </div>
    </div>

</body>
</html>

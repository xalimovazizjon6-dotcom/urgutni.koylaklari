<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👕 "Urgutning ko'ylaklari" - Tizimga Kirish</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            background-color: #030712;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Orqa fondagi harakatlanuvchi neon sharlar */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.45;
            animation: floatOrb 10s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 380px;
            height: 380px;
            background: #00c6ff;
            top: -100px;
            left: -100px;
        }
        .orb-2 {
            width: 420px;
            height: 420px;
            background: #2563eb;
            bottom: -120px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* Kengaytirilgan Glassmorphism Bootstrap Card */
        .login-card {
            position: relative;
            z-index: 1;
            max-width: 980px;
            width: 100%;
            background: rgba(11, 19, 43, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1.5px solid rgba(0, 198, 255, 0.45);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 35px rgba(0, 198, 255, 0.25);
            overflow: hidden;
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Inputlar dizayni */
        .custom-input-group {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.65);
            transition: all 0.3s ease;
        }

        .custom-input-group:focus-within {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
            background: rgba(15, 23, 42, 0.95);
        }

        .custom-input-group .input-group-text {
            background: transparent;
            border: none;
            color: #38bdf8;
            padding-left: 16px;
        }

        .custom-input-group .form-control {
            background: transparent;
            border: none;
            color: #f8fafc;
            padding: 13px 14px 13px 6px;
            font-size: 0.95rem;
        }

        .custom-input-group .form-control::placeholder {
            color: #64748b;
        }

        .custom-input-group .form-control:focus {
            box-shadow: none;
            color: #ffffff;
        }

        .toggle-pass-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding-right: 16px;
            transition: color 0.2s;
        }

        .toggle-pass-btn:hover {
            color: #38bdf8;
        }

        /* Kirish tugmasi */
        .submit-btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.35);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 198, 255, 0.55);
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        }

        /* O'ng tomon: Oval chetli ko'k gradient banner */
        .login-banner-side {
            background: linear-gradient(135deg, #0072ff 0%, #0a1f7a 55%, #03045e 100%);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.35);
        }

        /* Katta ekranlarda eski dizayndagi kabi chap chetini oval qilish */
        @media (min-width: 992px) {
            .login-banner-side {
                border-top-left-radius: 145px;
                border-bottom-left-radius: 45px;
            }
        }

        /* Banner ichidagi nozik nuqtali fon */
        .login-banner-side::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 22px 22px;
            opacity: 0.55;
        }

        .banner-content {
            position: relative;
            z-index: 2;
        }

        .brand-icon-box {
            width: 78px;
            height: 78px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3 p-md-4">

    <!-- Harakatlanuvchi neon sharlar -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- Asosiy Bootstrap Card (Panel) -->
    <div class="card login-card">
        <div class="row g-0">
            
            <!-- Chap tomon: Login Formasi -->
            <div class="col-lg-6 p-4 p-sm-5 d-flex flex-column justify-content-center">
                <div class="text-center mb-4">
                    <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 rounded-pill px-3 py-2 mb-3">
                        <i class="bi bi-stars me-1"></i> ERP Boshqaruv Paneli
                    </span>
                    <h2 class="text-white fw-bold mb-1">Tizimga kirish</h2>
                    <p class="text-secondary small mb-0">Davom etish uchun hisob ma'lumotlaringizni kiriting</p>
                </div>

                <!-- Bootstrap Forma -->
                <form action="dashboard.html" method="GET">
                    
                    <!-- Foydalanuvchi nomi -->
                    <div class="mb-3">
                        <label for="username" class="form-label text-light small fw-medium">Foydalanuvchi nomi</label>
                        <div class="input-group custom-input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person-fill fs-5"></i>
                            </span>
                            <input type="text" id="username" name="username" class="form-control" placeholder="Masalan: admin" required>
                        </div>
                    </div>

                    <!-- Parol -->
                    <div class="mb-3">
                        <label for="password" class="form-label text-light small fw-medium">Parol</label>
                        <div class="input-group custom-input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock-fill fs-5"></i>
                            </span>
                            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                            <button type="button" class="toggle-pass-btn" id="togglePassword" title="Parolni ko'rsatish">
                                <i class="bi bi-eye fs-5" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Eslab qolish va Parolni unutdingizmi (Tooltip) -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input bg-transparent border-secondary" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-secondary small" for="rememberMe">
                                Eslab qolish
                            </label>
                        </div>
                        <a href="#" class="text-info small text-decoration-none fw-medium"
                           data-bs-toggle="tooltip" 
                           data-bs-placement="top" 
                           title="Parolni tiklash uchun korxona rahbariyatiga bog'laning">
                           Parolni unutdingizmi?
                        </a>
                    </div>

                    <!-- Kirish tugmasi -->
                    <button type="submit" class="btn btn-primary submit-btn w-100 text-white">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Tizimga kirish
                    </button>
                </form>

                <!-- Pastki qism: Markazga tekislangan yozuv va Yordam (Popover) -->
                <div class="d-flex flex-column align-items-center text-center gap-2 mt-4 pt-3 border-top border-secondary border-opacity-25">
                    <span class="text-secondary small">
                        Akkauntingiz yo'qmi? 
                        <a href="#" class="text-info fw-semibold text-decoration-none"
                           data-bs-toggle="tooltip" 
                           data-bs-placement="top" 
                           title="Yangi xodim qo'shish uchun administratorga murojaat qiling">
                           Ro'yxatdan o'tish
                        </a>
                    </span>

                    <button type="button" class="btn btn-sm btn-outline-info rounded-pill px-4 mt-1"
                            data-bs-toggle="popover"
                            data-bs-trigger="focus"
                            data-bs-placement="top"
                            data-bs-title="Kirish bo'yicha yordam"
                            data-bs-content="Demo rejimda tizimga kirish uchun istalgan login va parolni yozib 'Tizimga kirish' tugmasini bosing.">
                        <i class="bi bi-question-circle me-1"></i>Yordam
                    </button>
                </div>
            </div>

            <!-- O'ng tomon: Markazga tekislangan va oval chetli banner -->
            <div class="col-lg-6 login-banner-side p-5 d-flex flex-column justify-content-center align-items-center text-center text-white">
                <div class="banner-content">
                    <div class="brand-icon-box">
                        <i class="bi bi-shop-window fs-1 text-info"></i>
                    </div>
                    <h1 class="fw-bold fst-italic display-5 mb-3">XUSH KELIBSIZ!</h1>
                    <p class="lead text-light text-opacity-75 mb-0 px-lg-3">
                        <strong>"Urgutning ko'ylaklari"</strong> — tikuvchilik korxonasi boshqaruv tizimi
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Tooltiplarni faollashtirish
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));

        // Popoverlarni faollashtirish
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
        [...popoverTriggerList].map(el => new bootstrap.Popover(el));

        // Parolni ko'rsatish / yashirish
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'bi bi-eye-slash fs-5' : 'bi bi-eye fs-5';
        });
    </script>
</body>
</html>
